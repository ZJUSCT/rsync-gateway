name: docker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  rsync-gateway:
    name: Build and push rsync-gateway image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR rejects uppercase in repository paths
          echo "IMAGE=ghcr.io/${owner_lc}/rsync-gateway:${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rsync-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}

  rsync-proxy:
    name: Build and push rsync-proxy image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR rejects uppercase in repository paths
          echo "IMAGE=ghcr.io/${owner_lc}/rsync-proxy:${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rsync-proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rsync-proxy
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
