{{- /*
Dedicated ServiceAccount for the manager. Created only when
rbac.serviceAccount.create is enabled; otherwise the Deployment references
the name in rbac.serviceAccount.name, or the namespace's "default" service
account (see the rsync-gateway.serviceAccountName helper).
*/ -}}
{{- if .Values.rbac.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rsync-gateway.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rsync-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
{{- end }}
